<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <link rel="stylesheet" href="style.css" />

</head>
<body>

  <header class="navbar">
    <div class="nav-logo">
      <img src="img/G.png.png" alt="Logo Portal GeoDuc" class="nav-logo-img" />
      Portal GeoDuc

    <nav class="nav-links">
      <a href="#">Turmas &amp; Cronogramas</a>
      <a href="#">Aulas</a>
      <a href="#">Questões &amp; Simulados</a>
      <a href="#">Meu Desempenho</a>
      <a href="#">GeoDuc+</a>
      <a href="#">Fórum</a>
    </nav>

    <div class="nav-actions">
      <div class="nav-auth-group">

        <a href="#" class="btn-auth">Cadastrar-se</a>
        <a href="#" class="btn-auth">Ajuda</a>
      </div>
      <button class="btn-search" aria-label="Buscar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>

      </button>
    </div>

  <main class="hero">
    <div class="bg-pattern" aria-hidden="true"></div>

    <div class="hero-content">
      <div class="hero-icon" aria-hidden="true">
      </div>

      <h1 class="hero-title">Portal GeoDuc</h1>

        O Portal GeoDuc é um espaço de educação interativa que traz<br />

      <button class="btn-ver-mais" onclick="window.location.href='ver-mais.html'">Ver Mais</button>

  <script src="api-chat.js"></script>
